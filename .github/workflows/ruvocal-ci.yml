name: ruvocal CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build chat-ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: swarmlo/src/ruvocal/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/npm-ci-retry
        with:
          working-directory: swarmlo/src/ruvocal

      - name: Build
        working-directory: swarmlo/src/ruvocal
        run: npm run build
