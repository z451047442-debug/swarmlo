# ============================================================================
# ruvocal deployment (Cloud Build -> Cloud Run)
#
# IMPORTANT (data layer): ruvocal persists to a SINGLE RVF JSON file on the
# container's filesystem (db/ruvocal.rvf.json) — it does NOT use MongoDB, and
# the image contains no embedded database. The RVF file is written atomically
# (tmp+rename) with a rolling .bak backup, but:
#   * Cloud Run's container filesystem is EPHEMERAL — every cold start loses
#     all data unless a persistent volume (gcloud run services update --volume
#     or multi-container revision with a mounted disk) is attached to /app/db.
#   * The RVF store is single-writer — the app MUST run as a SINGLE instance
#     (--max-instances 1) unless the volume backend guarantees mutual
#     exclusion; concurrent writers split/overwrite the file.
# If you need multi-instance scaling, migrate to a real shared database first.
# ============================================================================

steps:
  # Build the ruvocal image. Configuration is injected at runtime via
  # DOTENV_LOCAL (see entrypoint.sh); secrets are never baked into the image.
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args: [
      'build',
      '-t', 'gcr.io/${PROJECT_ID}/ruvocal:${_VERSION}',
      '-f', 'Dockerfile',
      '.'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${PROJECT_ID}/ruvocal:${_VERSION}']

  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'tag',
      'gcr.io/${PROJECT_ID}/ruvocal:${_VERSION}',
      'gcr.io/${PROJECT_ID}/ruvocal:latest'
    ]
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${PROJECT_ID}/ruvocal:latest']

  # Deploy to Cloud Run.
  #
  # NOTE: data is persisted to the single RVF JSON file on the container
  # filesystem. This deploy must be updated out-of-band to attach a persistent
  # volume to /app/db AND run with --max-instances 1 (see the header comment).
  # --allow-unauthenticated is kept only for the public chat product; the RVF
  # store is not a security boundary.
  #
  # Provider keys come from existing ruv-dev Secret Manager secrets per
  # ADR-029. Deploy with image only — preserves manually configured env vars
  # (DOTENV_LOCAL with PUBLIC_ORIGIN/OPENAI_BASE_URL/MODELS, OPENAI_API_KEY
  # secret mapping, etc.). Initial env config must be set out-of-band via
  # `gcloud run services update` (see ADR-033 deployment notes).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'ruvocal',
      '--image', 'gcr.io/${PROJECT_ID}/ruvocal:${_VERSION}',
      '--platform', 'managed',
      '--region', 'us-central1',
      '--port', '3000',
      '--memory', '2Gi',
      '--cpu', '2',
      '--min-instances', '0',
      '--max-instances', '1',
      '--timeout', '300',
      '--allow-unauthenticated'
    ]

substitutions:
  _VERSION: 'v1'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
timeout: 1800s
