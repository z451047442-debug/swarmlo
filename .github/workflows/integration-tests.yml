name: 🔗 Cross-Agent Integration Tests

# REVIEW FIX 2026-08-31 — this workflow previously "ran" agent-coordination,
# memory, fault-tolerance and performance simulations built entirely on
# Math.random() with `|| true` / `.catch(console.error)` swallowing — it
# could never fail and reported fabricated metrics. It has been replaced
# with real, deterministic repository-integrity checks that fail loudly.
# The real unit/integration test gates live in v3-ci.yml ("Test V3
# Packages": pnpm install + build + pnpm test), which is the canonical
# CI test surface for this monorepo.

on:
  push:
    branches: [main, develop, alpha-*]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run integration checks daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # Repository integrity — real, self-contained checks (no build required)
  repository-integrity:
    name: 🧩 Repository Integrity Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/npm-ci-retry

      - name: Umbrella package version lockstep
        run: node scripts/audit-umbrella-version-lockstep.mjs

      - name: MetaHarness pins declared installably
        run: node scripts/check-metaharness-pins.mjs

      - name: neural-trader install-safety guard (#1974)
        run: node scripts/audit-neural-trader-safety.mjs

      - name: Plugin manifest audit
        run: node scripts/audit-plugin-manifest.mjs
        continue-on-error: true

  # Cross-package smoke — the published CLI actually boots and answers
  # --version (guards the swarmlo-cli/swarmlo/swarmlo-app publish train).
  cli-smoke:
    name: 🚀 Published CLI Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify published CLI answers --version
        run: |
          VER=$(npx -y swarmlo-cli@3.39.1 --version)
          echo "swarmlo-cli --version → $VER"
          echo "$VER" | grep -qE '3\.[0-9]+\.[0-9]+' || { echo "unexpected version output: $VER"; exit 1; }
