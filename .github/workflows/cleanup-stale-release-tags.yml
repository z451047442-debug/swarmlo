name: Cleanup Stale Release Tags

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove stale candidate dist-tags
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js and npm authentication
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Remove stale candidate dist-tags (no swallowed errors)
        shell: bash
        run: |
          set -u
          packages=("swarmlo-cli" "swarmlo" "swarmlo-app")
          stale_tags=("release-3-39-1" "release-3-39-3")
          failures=0
          for package in "${packages[@]}"; do
            for tag in "${stale_tags[@]}"; do
              # Only attempt rm if the tag is actually present; rm of a
              # missing tag returns non-zero in some npm versions.
              if npm view "$package" dist-tags --json 2>/dev/null | grep -q "\"$tag\""; then
                echo "::group::rm ${package} ${tag}"
                npm dist-tag rm "$package" "$tag" || { echo "::error::rm ${package} ${tag} failed (exit $?)"; failures=$((failures+1)); }
                echo "::endgroup::"
              else
                echo "${package} ${tag} already absent — skip"
              fi
            done
            echo "--- ${package} final dist-tags ---"
            npm view "$package" dist-tags --json
          done
          if [[ "$failures" -ne 0 ]]; then
            echo "::error::${failures} stale-tag rm(s) failed"
            exit 1
          fi
